<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Cronograma de Escala — 2026</title>
</head>
  <body>
    <div class="menu_superior">
        <header>
        <div class="eyebrow">Escala 12x36</div>
        <h1>Mateus Rodrigues dos Santos</h1>
        <div class="sub">Janeiro → Dezembro de 2026</div>
      </header>

      <div class="legend">
        <span><i class="dot folga"></i>Folga</span>
        <span><i class="dot trabalho"></i>Trabalho</span>
        <span><i class="dot folga-past"></i>Folga (passada)</span>
        <span><i class="dot trabalho-past"></i>Trabalho (passado)</span>
      </div>
    </div>

    <div id="calendar"></div>

    <footer>
      <p>
        Gerado a partir de Agosto - 2026 <br> Afim de consultar os dias de trabalho
      </p>
  
      <a href="https://github.com/Mateus-Saantos" target="_blank">
        <img class="github-icon" src="img/GitHub_Logo.svg" alt="GitHub">
      </a>
    </footer>

    <!-- Modal de edição do dia -->
    <div id="modalOverlay" class="modal-overlay">
      <div class="modal">
        <button id="modalClose" class="modal-close" type="button">&times;</button>
        <h2 id="modalDate">--</h2>

        <label for="modalStatus">Status</label>
        <select id="modalStatus">
          <option value="folga">Folga</option>
          <option value="trabalho">Trabalho</option>
        </select>

        <label for="modalComment">Comentário</label>
        <textarea id="modalComment" rows="3" placeholder="Ex: FT programada às 08:00"></textarea>

        <div class="modal-actions">
          <button id="modalReset" type="button" class="btn-ghost">Restaurar automático</button>
          <button id="modalSave" type="button" class="btn-save">Salvar</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
